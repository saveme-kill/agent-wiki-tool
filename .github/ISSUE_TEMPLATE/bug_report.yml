name: Bug Report
description: Report a bug or unexpected behavior in wiki-core, wiki CLI, wiki-mcp, or scripts.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill out the sections below so we can reproduce it quickly.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - wiki-core (library / search / links / lint / frontmatter)
        - wiki-cli (`wiki` binary)
        - wiki-mcp (`wiki-mcp` MCP stdio server)
        - scripts (`feishu-ingest.sh` / `import-lark-docs.py`)
        - documentation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Minimal commands, MCP tool payload, or page markdown that triggers the issue.
      placeholder: |
        1. `wiki init ./tmp-wiki`
        2. `wiki -C ./tmp-wiki ...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (OS, Rust / `wiki --version`, MCP client)
      placeholder: "e.g., Windows 11 / macOS 15 / Ubuntu 24.04, rustc 1.95, Claude Desktop"
    validations:
      required: true
