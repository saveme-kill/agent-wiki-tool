name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or version label for dry-run artifacts (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          STAGE="agent-wiki-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/wiki" "dist/${STAGE}/"
          cp "target/${{ matrix.target }}/release/wiki-mcp" "dist/${STAGE}/"
          cp README.md README.zh-CN.md "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          (cd dist && shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256")
          rm -rf "dist/${STAGE}"

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Version = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $Stage = "agent-wiki-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$Stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/wiki.exe" "dist/$Stage/"
          Copy-Item "target/${{ matrix.target }}/release/wiki-mcp.exe" "dist/$Stage/"
          Copy-Item README.md, README.zh-CN.md "dist/$Stage/"
          Compress-Archive -Path "dist/$Stage" -DestinationPath "dist/$Stage.zip"
          $Hash = (Get-FileHash -Algorithm SHA256 "dist/$Stage.zip").Hash.ToLower()
          "$Hash  $Stage.zip" | Out-File -Encoding utf8 -NoNewline "dist/$Stage.zip.sha256"
          "`n" | Add-Content -Encoding utf8 -NoNewline "dist/$Stage.zip.sha256"
          Remove-Item -Recurse -Force "dist/$Stage"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
